<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e8d5"/>
      <stop offset="100%" stop-color="#ddd0b5"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a7040"/>
      <stop offset="30%" stop-color="#c49858"/>
      <stop offset="70%" stop-color="#b88848"/>
      <stop offset="100%" stop-color="#8a6030"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a860"/>
      <stop offset="50%" stop-color="#c09050"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0b870"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <filter id="s"><feDropShadow dx="5" dy="8" stdDeviation="10" flood-color="#5c3810" flood-opacity="0.3"/></filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Ombre sol -->
  <ellipse cx="400" cy="560" rx="195" ry="12" fill="#7a4f20" opacity="0.2"/>

  <!-- Corps principal -->
  <rect x="185" y="85" width="430" height="468" rx="4" fill="url(#body)" filter="url(#s)"/>

  <!-- Côtés légèrement plus sombres -->
  <rect x="185" y="85" width="25" height="468" rx="4" fill="#7a5028" opacity="0.5"/>
  <rect x="590" y="85" width="25" height="468" rx="4" fill="#6a4018" opacity="0.5"/>

  <!-- Corniche du haut ornementée -->
  <rect x="170" y="68" width="460" height="28" rx="4" fill="url(#top)" filter="url(#s)"/>
  <rect x="175" y="62" width="450" height="14" rx="3" fill="#e8c070"/>
  <!-- Moulure corniche -->
  <path d="M175 90 Q180 85 185 90 L615 90 Q620 85 625 90 L625 96 L175 96 Z" fill="#c09050" opacity="0.6"/>

  <!-- Plinthe bas -->
  <rect x="178" y="542" width="444" height="20" rx="3" fill="#9a7038" filter="url(#s)"/>
  <rect x="185" y="538" width="430" height="8" rx="2" fill="#b88848" opacity="0.8"/>

  <!-- Séparation centrale (2 portes) -->
  <rect x="395" y="92" width="10" height="450" rx="2" fill="#7a5028"/>

  <!-- PORTE GAUCHE -->
  <!-- Panneau haut gauche -->
  <rect x="200" y="105" width="186" height="155" rx="4" fill="url(#panel)"/>
  <!-- Moulure intérieure panneau haut gauche -->
  <rect x="206" y="111" width="174" height="143" rx="3" fill="none" stroke="#c09050" stroke-width="3" opacity="0.5"/>
  <rect x="212" y="117" width="162" height="131" rx="2" fill="none" stroke="#e0c070" stroke-width="1.5" opacity="0.3"/>

  <!-- Panneau bas gauche -->
  <rect x="200" y="272" width="186" height="255" rx="4" fill="url(#panel)"/>
  <!-- Moulure intérieure panneau bas gauche -->
  <rect x="206" y="278" width="174" height="243" rx="3" fill="none" stroke="#c09050" stroke-width="3" opacity="0.5"/>
  <rect x="212" y="284" width="162" height="231" rx="2" fill="none" stroke="#e0c070" stroke-width="1.5" opacity="0.3"/>

  <!-- Entretoise entre panneaux gauche -->
  <rect x="200" y="260" width="186" height="16" rx="2" fill="#9a7038"/>

  <!-- Poignée porte gauche (bronze) -->
  <ellipse cx="366" cy="308" rx="8" ry="12" fill="#c89040" stroke="#a87028" stroke-width="1.5"/>
  <circle cx="366" cy="314" r="4" fill="#a87028"/>

  <!-- PORTE DROITE -->
  <!-- Panneau haut droit -->
  <rect x="414" y="105" width="186" height="155" rx="4" fill="url(#panel)"/>
  <rect x="420" y="111" width="174" height="143" rx="3" fill="none" stroke="#c09050" stroke-width="3" opacity="0.5"/>
  <rect x="426" y="117" width="162" height="131" rx="2" fill="none" stroke="#e0c070" stroke-width="1.5" opacity="0.3"/>

  <!-- Panneau bas droit -->
  <rect x="414" y="272" width="186" height="255" rx="4" fill="url(#panel)"/>
  <rect x="420" y="278" width="174" height="243" rx="3" fill="none" stroke="#c09050" stroke-width="3" opacity="0.5"/>
  <rect x="426" y="284" width="162" height="231" rx="2" fill="none" stroke="#e0c070" stroke-width="1.5" opacity="0.3"/>

  <!-- Entretoise entre panneaux droit -->
  <rect x="414" y="260" width="186" height="16" rx="2" fill="#9a7038"/>

  <!-- Poignée porte droite (bronze) -->
  <ellipse cx="434" cy="308" rx="8" ry="12" fill="#c89040" stroke="#a87028" stroke-width="1.5"/>
  <circle cx="434" cy="314" r="4" fill="#a87028"/>

  <!-- Veines du bois discrètes -->
  <g opacity="0.1" stroke="#5c3818" stroke-width="1.5" fill="none">
    <path d="M210 120 Q290 118 370 121"/>
    <path d="M210 138 Q290 136 370 139"/>
    <path d="M424 120 Q504 118 584 121"/>
    <path d="M424 138 Q504 136 584 139"/>
  </g>

  <!-- Petites charnières décoratives -->
  <rect x="197" y="115" width="8" height="30" rx="2" fill="#a07838" opacity="0.7"/>
  <rect x="197" y="215" width="8" height="30" rx="2" fill="#a07838" opacity="0.7"/>
  <rect x="395" y="115" width="8" height="30" rx="2" fill="#a07838" opacity="0.7"/>
  <rect x="395" y="215" width="8" height="30" rx="2" fill="#a07838" opacity="0.7"/>
  <rect x="595" y="115" width="8" height="30" rx="2" fill="#a07838" opacity="0.7"/>
  <rect x="595" y="215" width="8" height="30" rx="2" fill="#a07838" opacity="0.7"/>

  <text x="400" y="590" font-family="Georgia, serif" font-size="16" fill="#7a4f20" text-anchor="middle" opacity="0.7" font-style="italic">Restauration XIXe · finition gomme-laque</text>
</svg>
