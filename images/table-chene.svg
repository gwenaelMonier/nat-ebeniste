<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="tabletop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8955a"/>
      <stop offset="40%" stop-color="#b07840"/>
      <stop offset="100%" stop-color="#8b5e30"/>
    </linearGradient>
    <linearGradient id="tableleg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a4f28"/>
      <stop offset="50%" stop-color="#9e6a38"/>
      <stop offset="100%" stop-color="#6b3e1e"/>
    </linearGradient>
    <linearGradient id="tableleg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b3e1e"/>
      <stop offset="50%" stop-color="#8a5830"/>
      <stop offset="100%" stop-color="#5c3318"/>
    </linearGradient>
    <linearGradient id="bggrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5ede0"/>
      <stop offset="100%" stop-color="#e8d5b8"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a870" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c8a870" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropshadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6b3e1e" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="800" height="600" fill="url(#bggrad)"/>

  <!-- Ombre portée au sol -->
  <ellipse cx="400" cy="530" rx="260" ry="18" fill="#8b5e30" opacity="0.18"/>

  <!-- Pieds avant gauche -->
  <rect x="158" y="340" width="28" height="190" rx="4" fill="url(#tableleg)" filter="url(#dropshadow)"/>
  <rect x="158" y="500" width="28" height="30" rx="3" fill="#5c3318"/>

  <!-- Pieds avant droit -->
  <rect x="614" y="340" width="28" height="190" rx="4" fill="url(#tableleg)" filter="url(#dropshadow)"/>
  <rect x="614" y="500" width="28" height="30" rx="3" fill="#5c3318"/>

  <!-- Pieds arrière gauche (perspective) -->
  <rect x="210" y="260" width="20" height="150" rx="3" fill="url(#tableleg2)"/>

  <!-- Pieds arrière droit (perspective) -->
  <rect x="570" y="260" width="20" height="150" rx="3" fill="url(#tableleg2)"/>

  <!-- Entretoise -->
  <rect x="180" y="430" width="440" height="16" rx="4" fill="#7a4f28" opacity="0.8"/>

  <!-- Plateau de table — dessous (épaisseur) -->
  <path d="M130 305 L670 305 L700 345 L100 345 Z" fill="#7a4f28"/>

  <!-- Plateau de table — dessus -->
  <path d="M130 230 L670 230 L700 305 L100 305 Z" fill="url(#tabletop)" filter="url(#dropshadow)"/>

  <!-- Veines du bois sur le plateau -->
  <g opacity="0.18" stroke="#5c3318" stroke-width="1.5" fill="none">
    <path d="M160 248 Q350 244 660 250"/>
    <path d="M155 260 Q350 256 665 262"/>
    <path d="M152 272 Q350 268 668 274"/>
    <path d="M150 284 Q350 280 670 286"/>
    <path d="M150 296 Q350 292 670 298"/>
  </g>
  <!-- Reflet sur le plateau -->
  <path d="M140 234 L580 234 L600 258 L120 258 Z" fill="white" opacity="0.12"/>

  <!-- Nœud du bois décoratif -->
  <ellipse cx="280" cy="268" rx="22" ry="10" fill="none" stroke="#7a4f28" stroke-width="1.5" opacity="0.3"/>
  <ellipse cx="280" cy="268" rx="12" ry="5" fill="none" stroke="#7a4f28" stroke-width="1" opacity="0.25"/>

  <!-- Chaises suggérées -->
  <g opacity="0.25" fill="#8b5e30">
    <rect x="48" y="330" width="70" height="8" rx="2"/>
    <rect x="55" y="338" width="12" height="80" rx="2"/>
    <rect x="100" y="338" width="12" height="80" rx="2"/>
    <rect x="55" y="338" width="57" height="40" rx="2" opacity="0.5"/>
  </g>
  <g opacity="0.2" fill="#8b5e30">
    <rect x="682" y="330" width="70" height="8" rx="2"/>
    <rect x="688" y="338" width="12" height="80" rx="2"/>
    <rect x="733" y="338" width="12" height="80" rx="2"/>
    <rect x="688" y="338" width="57" height="40" rx="2" opacity="0.5"/>
  </g>

  <!-- Étiquette de matière -->
  <text x="400" y="578" font-family="Georgia, serif" font-size="16" fill="#8b5e30" text-anchor="middle" opacity="0.7" font-style="italic">Chêne massif · finition huile dure</text>
</svg>
